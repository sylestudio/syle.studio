[package]
name = "syle-api"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "syle-api"
path = "src/main.rs"

[lib]
name = "syle_api"
path = "src/lib.rs"

[dependencies]
syle-types.workspace = true
syle-core.workspace = true
syle-render.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
anyhow.workspace = true
axum = { version = "0.8", features = ["multipart"] }
axum-extra = { version = "0.10", features = ["cookie"] }
tower-http = { version = "0.6", features = ["fs"] }
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "postgres",
  "uuid",
  "json",
] }
argon2 = "0.5"
rand = "0.8"
uuid = { version = "1", features = ["serde", "v4"] }
# webauthn-rs and webauthn-authenticator-rs MUST stay pinned to the SAME exact
# version: each transitively pins webauthn-rs-proto exactly, so any drift breaks
# Cargo resolution. Bump both in lockstep. `danger-allow-state-serialisation` is
# required for PasskeyRegistration/PasskeyAuthentication to be serde-(de)serializable
# (ceremony state is parked in JSONB between start/finish).
webauthn-rs = { version = "=0.5.5", features = ["danger-allow-state-serialisation"] }
url = "2"

[dev-dependencies]
tokio.workspace = true
dotenvy = "0.15"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
serial_test = "3"
image = { version = "0.25", default-features = false, features = ["png"] }
tempfile = "3"
# Browserless WebAuthn round-trip for tests. Pinned in lockstep with webauthn-rs
# (see note above). `softpasskey` provides the SoftPasskey authenticator backend.
webauthn-authenticator-rs = { version = "=0.5.5", features = ["softpasskey"] }
