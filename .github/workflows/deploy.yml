name: deploy

# Build and deploy the three artifacts to vps2 from a self-hosted runner that
# lives on the box itself. The runner user (github-runner) is unprivileged; the
# one-time infra (DB, dirs, systemd unit, nginx, certbot) is provisioned out of
# band. Here we only build, drop artifacts into github-runner-owned dirs under
# /opt/syle, and use a narrow sudoers rule to restart the API and reload nginx.

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; never cancel a deploy mid-flight.
concurrency:
  group: deploy-vps2
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, vps2]
    env:
      CARGO_TERM_COLOR: always
      NO_COLOR: "false"
      API_BASE: http://127.0.0.1:8080
      PUBLIC_BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Reuse this runner's Cargo build artifacts
        run: |
          target="/opt/syle/cache/cargo/$RUNNER_NAME"
          mkdir -p "$target"
          echo "CARGO_TARGET_DIR=$target" >> "$GITHUB_ENV"

      - name: Restore generated responsive images
        id: responsive-image-cache
        uses: actions/cache@v4
        with:
          path: web/public/project-media
          key: static-images-${{ runner.os }}-${{ hashFiles('web/src/generated/static-images.json') }}

      - name: Reuse responsive images already deployed on VPS2
        if: steps.responsive-image-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p web/public/project-media
          if [ -d /opt/syle/web/project-media ]; then
            rsync -a --ignore-existing /opt/syle/web/project-media/ web/public/project-media/
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
          dest: ${{ runner.temp }}/setup-pnpm

      - name: Toolchain (rust + wasm + trunk, idempotent, no sudo)
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain none --profile minimal
          fi
          . "$HOME/.cargo/env"
          # CI and deploy share RUSTUP_HOME across the VPS2 runners. Lock only
          # the toolchain mutation so concurrent Cargo builds stay parallel.
          flock /opt/syle/cache/rustup.lock \
            rustup toolchain install stable \
              --target wasm32-unknown-unknown \
              --profile minimal \
              --no-self-update
          command -v trunk >/dev/null 2>&1 || cargo install trunk --locked
          echo "$HOME/.cargo/bin"     >> "$GITHUB_PATH"

      - name: Build API (release)
        run: cargo build --release -p syle-api

      - name: Build CRM (Leptos -> wasm, trunk release)
        run: |
          set -euo pipefail
          # --ignore-scripts: pnpm v10 hard-fails under CI when a dep has an
          # unapproved build script (@parcel/watcher here). Those native deps
          # ship prebuilt platform binaries via optional deps, so skipping the
          # scripts is harmless — same module state as local dev.
          pnpm --dir admin install --frozen-lockfile --ignore-scripts
          trunk build --release --config admin/Trunk.toml

      - name: Deploy API + CRM, restart API
        run: |
          set -euo pipefail
          install -m 0755 "$CARGO_TARGET_DIR/release/syle-api" /opt/syle/bin/syle-api.new
          mv -f /opt/syle/bin/syle-api.new /opt/syle/bin/syle-api
          rsync -a --delete admin/dist/ /opt/syle/admin/
          sudo /usr/bin/systemctl restart syle-api
          # Wait for the API to answer a public endpoint before building the site.
          ok=
          for _ in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/public/galleries || true)
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 0.5
          done
          [ -n "$ok" ] || { echo "API did not become healthy"; sudo /usr/bin/systemctl is-active syle-api || true; exit 1; }
          echo "API healthy."

      - name: Build public site (Astro, against the live API)
        run: |
          set -euo pipefail
          pnpm --dir web install --frozen-lockfile --ignore-scripts
          if pnpm --dir web images:check; then
            echo "Responsive images are complete; skipping the Rust optimizer."
            pnpm --dir web build:cached
          else
            echo "Responsive images are incomplete; generating only missing derivatives."
            pnpm --dir web build
          fi

      - name: Deploy public site, reload nginx
        run: |
          set -euo pipefail
          rsync -a --delete deploy/nginx/ /opt/syle/nginx/
          rsync -a --delete web/dist/ /opt/syle/web/
          sudo /usr/bin/systemctl reload nginx
          origin=(--noproxy '*' --resolve syle.studio:443:127.0.0.1)
          html=$(curl -fsS "${origin[@]}" https://syle.studio/)
          grep -Fq "name=\"syle-revision\" content=\"$GITHUB_SHA\"" <<<"$html"
          curl -fsS "${origin[@]}" \
            https://syle.studio/api/public/galleries >/dev/null
          if [[ "$html" =~ (/project-media/[a-f0-9]+\.(avif|jpeg)) ]]; then
            media_path="${BASH_REMATCH[1]}"
          else
            echo "No responsive project-media URL found in deployed HTML"
            exit 1
          fi
          media_headers=$(curl -fsSI "${origin[@]}" \
            "https://syle.studio$media_path")
          grep -Eiq '^cache-control:.*immutable' <<<"$media_headers"
          missing_headers=$(curl -sSI "${origin[@]}" \
            -A 'Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)' \
            https://syle.studio/__deploy_missing__)
          missing_code=$(awk 'toupper($1) ~ /^HTTP\// { code=$2 } END { print code }' <<<"$missing_headers")
          [ "$missing_code" = "404" ]
          grep -Eiq '^x-robots-tag:.*noindex.*follow' <<<"$missing_headers"
          missing_html=$(curl -sS "${origin[@]}" https://syle.studio/__deploy_missing__)
          grep -Fq 'content="noindex,follow"' <<<"$missing_html"
          ! grep -Fq 'rel="canonical"' <<<"$missing_html"

          robots=$(curl -fsS "${origin[@]}" https://syle.studio/robots.txt)
          grep -Fq 'Sitemap: https://syle.studio/sitemap-index.xml' <<<"$robots"
          sitemap_index=$(curl -fsS "${origin[@]}" https://syle.studio/sitemap-index.xml)
          grep -Fq '<sitemapindex' <<<"$sitemap_index"
          grep -Fq '<loc>https://syle.studio/sitemap-pages.xml</loc>' <<<"$sitemap_index"
          sitemap_pages=$(curl -fsS "${origin[@]}" https://syle.studio/sitemap-pages.xml)
          grep -Fq '<urlset' <<<"$sitemap_pages"

          apex_redirect=$(curl -sSI http://syle.studio/__deploy_redirect__?source=smoke)
          grep -Eq '^HTTP/[^ ]+ 301' <<<"$apex_redirect"
          grep -Eiq '^location: https://syle\.studio/__deploy_redirect__\?source=smoke' <<<"$apex_redirect"
          www_redirect=$(curl -sSI https://www.syle.studio/__deploy_redirect__?source=smoke)
          grep -Eq '^HTTP/[^ ]+ 301' <<<"$www_redirect"
          grep -Eiq '^location: https://syle\.studio/__deploy_redirect__\?source=smoke' <<<"$www_redirect"
          legacy_email_redirect=$(curl -sSI "${origin[@]}" \
            https://syle.studio/cdn-cgi/l/email-protection)
          grep -Eq '^HTTP/[^ ]+ 301' <<<"$legacy_email_redirect"
          grep -Eiq '^location: https://syle\.studio/#contacto' <<<"$legacy_email_redirect"
          echo "Deploy complete; public site serves $GITHUB_SHA."
