[package]
name = "syle-admin"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
syle-types.workspace = true
syle-render.workspace = true
serde.workspace = true
serde_json.workspace = true
leptos = { version = "0.7", features = ["csr"] }
leptos_router = "0.7"
console_error_panic_hook = "0.1"
gloo-net = { version = "0.6", features = ["http"] }
gloo-timers = { version = "0.3", features = ["futures"] }
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "FormData",
  "HtmlFormElement",
  "HtmlInputElement",
  "FileList",
  "File",
  "RequestCredentials",
  "XmlHttpRequest",
  "XmlHttpRequestUpload",
  "ProgressEvent",
  "Event",
  "Window",
  "Document",
  "Crypto",
  "Node",
  "NodeList",
  "Element",
  "HtmlElement",
  "Text",
  "CharacterData",
  "DocumentFragment",
  "Selection",
  "Range",
  "KeyboardEvent",
  "InputEvent",
  "ClipboardEvent",
  "DataTransfer",
  "DragEvent",
  "DomTokenList",
  "CssStyleDeclaration",
  "Blob",
  "Url",
  "HtmlImageElement",
  "HtmlCanvasElement",
  "CanvasRenderingContext2d",
  "CanvasGradient",
  "PointerEvent",
  "MouseEvent",
  "DomRect",
] }
syle-imageedit.workspace = true
