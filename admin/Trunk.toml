# Paths here are relative to this file's directory (admin/).
[build]
target = "index.html"
dist = "dist"

[serve]
addresses = ["127.0.0.1"]
port = 8081

# Dev only: make /api same-origin by proxying to the local API, emulating the
# production same-origin setup (Caddy in front of the Tunnel).
[[proxy]]
backend = "http://127.0.0.1:8080/api/"

[[proxy]]
backend = "http://127.0.0.1:8080/media/"

# Compile Tailwind v4 before trunk processes the linked stylesheet.
[[hooks]]
stage = "pre_build"
command = "sh"
command_arguments = [
  "-c",
  "pnpm exec tailwindcss -i styles/main.css -o styles/tailwind.css --minify",
]
