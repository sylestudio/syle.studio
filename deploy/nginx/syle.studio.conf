# Public site origin (behind the Cloudflare CDN, proxied/orange). nginx serves
# the static Astro build; /media derivatives are proxied to the API and cached
# hard at the edge (content-addressed, immutable).
#
# This zone's Cloudflare SSL/TLS mode is "Flexible", so Cloudflare fetches the
# origin over HTTP :80. We therefore serve the site on BOTH :80 and :443 with no
# http->https redirect — a redirect on :80 would make Cloudflare loop. The cert
# still secures direct HTTPS and enables a future Full(strict) upgrade.
# certbot --nginx provisions/renews the cert in place.
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name syle.studio www.syle.studio;

    ssl_certificate /etc/letsencrypt/live/syle.studio/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/syle.studio/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /opt/syle/web;
    index index.html;

    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /project-media/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Public read API only. Administrative endpoints remain scoped to the
    # admin.syle.studio vhost instead of being exposed on the public origin.
    location ^~ /api/public/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
