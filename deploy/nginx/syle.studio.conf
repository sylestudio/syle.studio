# Public site origin (behind the Cloudflare CDN, proxied/orange). nginx serves
# the static Astro build; /media derivatives are proxied to the API and cached
# hard at the edge (content-addressed, immutable). certbot --nginx manages TLS
# and the :80 -> :443 redirect (the `# managed by Certbot` blocks it adds).
server {
    listen 80;
    listen [::]:80;
    server_name syle.studio www.syle.studio;

    root /opt/syle/web;
    index index.html;

    # Astro's content-hashed bundles — immutable.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Content-addressed media derivatives, served by the API's media dir.
    location /media/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /404.html;
    }
}
