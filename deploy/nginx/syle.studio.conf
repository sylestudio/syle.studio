# Public site origin (behind the Cloudflare CDN, proxied/orange). Cloudflare
# uses a hostname-scoped Configuration Rule with Full (strict) for syle.studio
# and www; the zone-wide default remains unchanged for unrelated origins.

server {
    listen 80;
    listen [::]:80;
    server_name syle.studio www.syle.studio;

    return 301 https://syle.studio$request_uri;
}

# Direct and proxied requests for www converge on the HTTPS apex in one hop.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.syle.studio;

    ssl_certificate /etc/letsencrypt/live/syle.studio/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/syle.studio/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://syle.studio$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name syle.studio;

    ssl_certificate /etc/letsencrypt/live/syle.studio/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/syle.studio/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /opt/syle/web;
    index index.html;
    error_page 404 /404.html;

    # Keep former/common sitemap endpoints working for crawlers and bookmarks.
    location = /sitemap.xml {
        return 301 https://syle.studio/sitemap-index.xml$is_args$args;
    }

    location = /sitemap_index.xml {
        return 301 https://syle.studio/sitemap-index.xml$is_args$args;
    }

    # Bespoke project pages supersede any historical generic gallery URL.
    location ~ ^/galleries/(catedral|dango|insomnio|laobsesion|rupture|syle)/?$ {
        return 301 https://syle.studio/proyectos/$1/$is_args$args;
    }

    # Internally render the branded page while retaining the original 404.
    location = /404.html {
        internal;
        add_header X-Robots-Tag "noindex, follow" always;
    }

    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /project-media/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Public read API only. Administrative endpoints remain scoped to the CRM.
    # It is functional data, not a search result, so exclude it by HTTP header.
    location ^~ /api/public/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    location /media/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
