# CRM origin. DNS is direct (grey-cloud), and the SPA plus every proxied API
# response is explicitly excluded from search without affecting authentication
# or client-side routing.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name admin.syle.studio;

    ssl_certificate /etc/letsencrypt/live/admin.syle.studio/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.syle.studio/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /opt/syle/admin;
    index index.html;
    client_max_body_size 64M;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback for client-side routes (/login, /).
    location / {
        try_files $uri /index.html;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name admin.syle.studio;

    return 301 https://admin.syle.studio$request_uri;
}
