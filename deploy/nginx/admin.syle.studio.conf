# CRM origin. The SPA is served statically with a client-side-routing fallback;
# /api and /media are reverse-proxied to the API on the same origin so the
# HttpOnly session cookie scoped to /api/admin works. Protected by the app's
# Argon2id login; certbot --nginx manages TLS. DNS for this host is DNS-only
# (grey) in Cloudflare — no CDN in front of the CRM.
server {
    listen 80;
    listen [::]:80;
    server_name admin.syle.studio;

    root /opt/syle/admin;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback for client-side routes (/login, /).
    location / {
        try_files $uri /index.html;
    }
}
